<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devocionales</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600&display=swap');

        body {
            margin: 0;
            font-family: 'Nunito', sans-serif;
            background-color: #fff8f9;
        }

        .hero {
            background: linear-gradient(135deg, #ffe4ec, #ffd6f0, #e8d5ff);
            text-align: center;
            padding: 60px 20px 50px;
            position: relative;
            overflow: hidden;
        }

        .hero::before,
        .hero::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.18;
        }

        .hero::before {
            width: 300px;
            height: 300px;
            background: #f9a8d4;
            top: -80px;
            left: -80px;
        }

        .hero::after {
            width: 250px;
            height: 250px;
            background: #c4b5fd;
            bottom: -60px;
            right: -60px;
        }

        .hero-icon {
            font-size: 3.5rem;
            margin-bottom: 10px;
            animation: latido 1.5s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes latido {
            0%, 100% { transform: scale(1); }
            50%       { transform: scale(1.15); }
        }

        .hero h1 {
            font-family: 'Pacifico', cursive;
            font-size: 2.8rem;
            color: #b5507a;
            margin: 0 0 12px;
            text-shadow: 1px 2px 6px rgba(181, 80, 122, 0.18);
        }

        .hero p {
            font-size: 1.1rem;
            color: #9b6fa0;
            max-width: 480px;
            margin: 0 auto;
            line-height: 1.7;
        }

        .flores {
            font-size: 1.6rem;
            letter-spacing: 8px;
            margin-top: 18px;
            opacity: 0.75;
        }

        /* Barra de busqueda */
        nav {
            display: flex;
            justify-content: center;
            padding: 28px 20px 10px;
            background-color: #fff8f9;
        }

        .buscador {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 420px;
            border-bottom: 2px solid #d63f7a;
            padding-bottom: 6px;
        }

        .buscador svg {
            flex-shrink: 0;
            color: #d63f7a;
        }

        .buscador input {
            border: none;
            outline: none;
            background: transparent;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            color: #7a3a5a;
            width: 100%;
        }

        .buscador input::placeholder {
            color: #c490aa;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header class="hero">
        <div class="hero-icon">&#x1F497;</div>
        <h1>Devocionales</h1>
        <p>Un espacio dulce y tranquilo para acercarte a Dios cada dia con fe y amor.</p>
        <div class="flores">&#x1F338; &#x1F339; &#x1F338;</div>
    </header>

    <nav>
        <div class="buscador">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="7"/>
                <line x1="16.5" y1="16.5" x2="22" y2="22"/>
            </svg>
            <input type="text" placeholder="Busca el tipo de devocional que deseas...">
        </div>
    </nav>
</body>
</html>
